<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="350" viewBox="0 0 1200 350" role="img" aria-labelledby="title desc">
  <title id="title">Ritesh Maurya — developer profile</title>
  <desc id="desc">A dark editorial banner with a cyan and violet abstract orbital illustration and Ritesh's focus areas.</desc>
  <defs>
    <linearGradient id="wash" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1220"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#67E8F9"/>
      <stop offset="1" stop-color="#A78BFA"/>
    </linearGradient>
    <radialGradient id="orb">
      <stop offset="0" stop-color="#0E7490" stop-opacity=".35"/>
      <stop offset="1" stop-color="#6D28D9" stop-opacity=".04"/>
    </radialGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#334155" stroke-width=".7" opacity=".42"/>
    </pattern>
  </defs>
  <rect width="1200" height="350" rx="22" fill="url(#wash)"/>
  <rect width="1200" height="350" rx="22" fill="url(#grid)"/>
  <rect x="1" y="1" width="1198" height="348" rx="21" fill="none" stroke="#263449" stroke-width="2"/>

  <text x="54" y="54" fill="#94A3B8" font-family="monospace" font-size="12" letter-spacing="3">DEVELOPER · BUILDER · STUDENT</text>
  <text x="52" y="150" fill="#F1F5F9" font-family="Georgia,serif" font-size="66" font-weight="700">Ritesh Maurya</text>
  <rect x="55" y="177" width="180" height="3" rx="1.5" fill="url(#accent)"/>
  <text x="55" y="220" fill="#D7E0EE" font-family="monospace" font-size="17">Frontend &amp; Full-Stack Development</text>
  <text x="55" y="251" fill="#94A3B8" font-family="monospace" font-size="14">Cloud · Applied AI · Open Source</text>
  <text x="55" y="309" fill="#64748B" font-family="monospace" font-size="11" letter-spacing="1.5">DEV BHOOMI UTTARAKHAND UNIVERSITY  /  INDIA</text>

  <circle cx="954" cy="174" r="139" fill="url(#orb)"/>
  <circle cx="954" cy="174" r="111" fill="none" stroke="#334155" stroke-width="1" stroke-dasharray="2 8"/>
  <ellipse cx="954" cy="174" rx="145" ry="48" transform="rotate(-28 954 174)" fill="none" stroke="#164E63" stroke-width="2"/>
  <ellipse cx="954" cy="174" rx="145" ry="48" transform="rotate(32 954 174)" fill="none" stroke="#5B21B6" stroke-width="2" opacity=".8"/>
  <circle cx="954" cy="174" r="28" fill="#0F172A" stroke="url(#accent)" stroke-width="2"/>
  <circle cx="954" cy="174" r="6" fill="#67E8F9"/>
  <circle cx="818" cy="238" r="5" fill="#67E8F9"/>
  <circle cx="1085" cy="115" r="5" fill="#A78BFA"/>
  <circle cx="1003" cy="38" r="4" fill="#67E8F9"/>
  <text x="954" y="324" text-anchor="middle" fill="#64748B" font-family="monospace" font-size="10" letter-spacing="2">LEARN  /  BUILD  /  SHARE</text>
</svg>
